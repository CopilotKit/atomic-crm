version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Workaround for dependabot/dependabot-core#14202: without an explicit
      # major group, major updates matching the minor-and-patch pattern are
      # silently suppressed. Remove this group when #14202 is fixed to get
      # individual (ungrouped) PRs per major bump instead.
      major:
        patterns:
          - "*"
        update-types:
          - "major"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1

  # pnpm is managed by Dependabot's npm ecosystem; the root lockfile covers
  # the root package and all pnpm workspace packages.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Keep majors visible while avoiding one PR for every package.
      major-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - "major"
      major-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - "major"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
